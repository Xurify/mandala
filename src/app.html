<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f8f5f0" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#15120f" media="(prefers-color-scheme: dark)" />
		<script>
			try {
				const root = document.documentElement;
				const storedTheme = localStorage.getItem('theme');
				if (storedTheme === 'dark' || storedTheme === 'light') {
					root.setAttribute('data-theme', storedTheme);
					const color = storedTheme === 'dark' ? '#15120f' : '#f8f5f0';
					for (const meta of document.querySelectorAll('meta[name="theme-color"]')) meta.setAttribute('content', color);
				}
				const storedAccent = localStorage.getItem('accent');
				const accentIds = ['ink', 'leaf', 'field', 'walnut', 'olive'];
				if (storedAccent && accentIds.includes(storedAccent)) {
					root.setAttribute('data-accent', storedAccent);
				}
				const storedMode = localStorage.getItem('mandala_view_mode');
				if (
					storedMode === 'view' ||
					storedMode === 'edit' ||
					storedMode === 'split' ||
					storedMode === 'today' ||
					storedMode === 'calendar' ||
					storedMode === 'board'
				) {
					root.dataset.view = storedMode;
				}
				if (localStorage.getItem('mandala_view_scale') === 'large') {
					root.dataset.scale = 'large';
				}
			} catch {
				// private mode / blocked storage
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents" data-app>
			%sveltekit.body%
		</div>
	</body>
</html>
